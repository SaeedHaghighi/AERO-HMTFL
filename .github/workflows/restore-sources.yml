name: Restore source files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact source files
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          files = {
              Path('.source_restore/vehicle.py.gz.b64'): Path('mftl/models/vehicle.py'),
              Path('.source_restore/simulator.py.gz.b64'): Path('mftl/simulation/simulator.py'),
          }

          for source, destination in files.items():
              destination.parent.mkdir(parents=True, exist_ok=True)
              payload = base64.b64decode(source.read_text().strip())
              destination.write_bytes(gzip.decompress(payload))
          PY

      - name: Validate Python syntax
        run: python -m py_compile mftl/models/vehicle.py mftl/simulation/simulator.py

      - name: Commit restored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mftl/models/vehicle.py mftl/simulation/simulator.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add core vehicle and simulator implementation"
          git push
